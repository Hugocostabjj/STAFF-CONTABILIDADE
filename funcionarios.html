<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Área da equipe | Staff Assessoria Contábil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@600;700;800&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="index.html" aria-label="Staff Assessoria Contábil, voltar ao site">
        <img src="https://staffassessoria.com/wp-content/uploads/2023/12/staff-logo-768x324.png" alt="Staff Assessoria Contábil" width="109" height="46">
      </a>
      <div class="acessos">
        <a class="btn btn-pequeno" href="index.html">Voltar ao site</a>
      </div>
    </div>
  </header>

  <main class="equipe">
    <div class="wrap">
      <p class="faixa-demo" id="faixa-demo" hidden>Modo demonstração: qualquer e-mail e senha entram. Não use com dados reais até conectar um login com servidor.</p>

      <section id="login">
        <div class="login-caixa">
          <h1>Área da equipe</h1>
          <p class="sub">Entre com seu e-mail e senha do escritório.</p>
          <form class="campos" id="form-login" novalidate>
            <div class="campo"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="username" required></div>
            <div class="campo"><label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required></div>
            <p class="aviso" id="erro-login" role="alert" hidden></p>
            <div><button class="btn btn-cheio" type="submit">Entrar</button></div>
          </form>
        </div>
      </section>

      <section id="painel" hidden>
        <div class="painel-topo">
          <div>
            <h1>Funções da equipe</h1>
            <p>Conectado como <span id="quem"></span></p>
          </div>
          <button class="btn btn-pequeno" id="btn-sair" type="button">Sair</button>
        </div>
        <ul class="funcoes" id="lista-funcoes"></ul>
      </section>
    </div>
  </main>

  <script src="assets/config.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/main.js"></script>
</body>
</html>
