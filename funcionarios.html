<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Área da equipe | Staff Assessoria Contábil</title>
  <link rel="icon" href="assets/img/favicon_staff-2-58x58.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css?v=2026-11-05">
</head>
<body>
  <header class="topo">
    <div class="wrap">
      <a class="marca" href="index.html" aria-label="Staff Assessoria Contábil, voltar ao site">
        <img src="assets/img/staff-logo-768x324.png" alt="Staff Assessoria Contábil" width="138" height="58">
      </a>
      <nav class="menu menu-simples" aria-label="Menu">
        <a href="index.html">Voltar ao site</a>
      </nav>
    </div>
  </header>

  <main class="equipe">
    <div class="wrap">
      <p class="faixa-demo" id="faixa-demo" hidden>Modo demonstração: qualquer e-mail e senha entram. Não use com dados reais até conectar um login com servidor.</p>

      <section id="login">
        <div class="login-caixa">
          <h1>Área da equipe</h1>
          <p class="sub">Entre com seu e-mail e senha do escritório.</p>
          <form class="campos" id="form-login" novalidate>
            <div class="campo"><input id="email" name="email" type="email" placeholder="E-mail" aria-label="E-mail" autocomplete="username" required></div>
            <div class="campo"><input id="senha" name="senha" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password" required></div>
            <p class="aviso" id="erro-login" role="alert" hidden></p>
            <button class="btn-env" type="submit">Entrar</button>
          </form>
        </div>
      </section>

      <section id="painel" hidden>
        <div class="painel-topo">
          <div>
            <h1>Funções da equipe</h1>
            <p>Conectado como <span id="quem"></span></p>
          </div>
          <button class="btn-sec" id="btn-sair" type="button">Sair</button>
        </div>
        <ul class="funcoes" id="lista-funcoes"></ul>
      </section>
    </div>
  </main>

  <footer>
    <div class="copia">
      <div class="wrap">&copy; <span id="ano"></span> Staff Assessoria Contábil - Todos os direitos reservados.</div>
    </div>
  </footer>

  <script src="assets/config.js?v=2026-11-05"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/main.js?v=2026-11-05"></script>
</body>
</html>
